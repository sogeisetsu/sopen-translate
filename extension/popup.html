<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>sopen-translate</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="head">
      <strong class="brand">sopen-translate</strong>
      <span id="provider" class="muted">读取中…</span>
    </header>

    <button id="main" class="round" type="button" aria-label="翻译此页">翻译</button>

    <div class="mode" role="group" aria-label="展示模式">
      <button type="button" data-mode="translation" aria-pressed="true">纯译文</button>
      <button type="button" data-mode="bilingual" aria-pressed="false">双语</button>
    </div>

    <div class="mode" role="group" aria-label="翻译范围">
      <button type="button" data-scope="viewport" aria-pressed="true">视口优先</button>
      <button type="button" data-scope="whole" aria-pressed="false">整页</button>
    </div>

    <select id="target-lang" class="input" aria-label="目标语言"></select>

    <p id="message" class="muted" role="status"></p>

    <footer class="foot">
      <a id="open-options" href="#">设置</a>
      <span id="target" class="muted"></span>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
